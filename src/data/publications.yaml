#  СПИСОК НАУЧНЫХ ТРУДОВ
#  Это ПРИМЕРЫ — замените на реальные работы.
#
#  Поля:
#    id        — уникальный идентификатор (латиница, без пробелов)
#    title     — название
#    authors   — список авторов (ваше имя выделится автоматически, см. AUTHOR_ALIASES в src/config.ts)
#    venue     — журнал / конференция / издательство
#    year      — год
#    type      — article | conference | preprint | thesis | book | talk
#    selected  — true, чтобы показать на главной
#    open      — true, если работа в открытом доступе
#    abstract  — аннотация (необязательно)
#    links     — pdf, doi, arxiv, code, slides, url (любые необязательны).
#                Номер arXiv пишите в кавычках: arxiv: "2501.00010"
#                PDF можно положить в папку public/papers/ и указать: pdf: papers/file.pdf
#    bibtex    — BibTeX-запись (необязательно, появится кнопка «Цитировать»)
# ════════════════════════════════════════════════════════════════

